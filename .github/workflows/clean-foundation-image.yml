name: Clean foundation image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact upstream custody
        run: scripts/provenance/verify-source.sh
      - name: Verify MHO-183 image contract
        run: scripts/release/mho183-contract.sh --static
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mhoo-os/mhoo-twenty-next:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/mhoo-os/mhoo-twenty-next
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Sign immutable candidate
        env:
          IMAGE_REF: ghcr.io/mhoo-os/mhoo-twenty-next@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
      - name: Verify immutable candidate signature
        env:
          IMAGE_REF: ghcr.io/mhoo-os/mhoo-twenty-next@${{ steps.image.outputs.digest }}
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp 'https://github.com/mhoo-os/mhoo-twenty-next/.github/workflows/clean-foundation-image.yml@.*'
      - name: Record immutable candidate digest
        run: |
          {
            printf 'image=ghcr.io/mhoo-os/mhoo-twenty-next@%s\n' '${{ steps.image.outputs.digest }}'
            printf 'source=${{ github.sha }}\n'
            printf 'signature=cosign-keyless\n'
            printf 'sbom=build-push-action\nprovenance=mode-max\n'
          } > candidate-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mho183-candidate-${{ github.sha }}
          path: candidate-digest.txt
