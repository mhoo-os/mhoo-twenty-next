name: Trajectory evaluation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  exact-head-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .agents/skills/pr-trajectory-audit/scripts/exact-head-fixture.test.sh
      - run: bash .agents/skills/pr-trajectory-audit/scripts/exact-head-fixture.sh
