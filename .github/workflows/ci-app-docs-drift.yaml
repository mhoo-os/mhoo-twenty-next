name: CI App Docs Drift

# When a PR changes the app-development surface (twenty-sdk, create-twenty-app,
# twenty-client-sdk, or the shared manifest types), an agent checks whether the
# app documentation under packages/twenty-docs/developers/extend/apps is
# impacted and, only when it is, posts a single sticky comment with its findings.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        .github/workflows/ci-app-docs-drift.yaml
        scripts/docs/**
        packages/twenty-sdk/**
        packages/create-twenty-app/**
        packages/twenty-client-sdk/**
        packages/twenty-shared/src/application/**
        packages/twenty-shared/src/types/**

  docs-drift-check:
    needs: changed-files-check
    # The deterministic checker uses no third-party credential, so it also
    # protects fork PRs. Bot PRs remain out of scope for this review surface.
    if: >-
      needs.changed-files-check.outputs.any_changed == 'true' &&
      github.event.pull_request.user.type != 'Bot'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Run deterministic docs drift check
        id: drift-check
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          python3 scripts/docs/check_app_docs_drift.py \
            --base "$BASE_REF" \
            --head HEAD \
            --json > "$result_file"
          {
            echo "has_drift=$(jq -r '.hasDrift' "$result_file")"
            echo "comment_needed=$(jq -r '.commentNeeded' "$result_file")"
            echo "summary=$(jq -r '.summary' "$result_file")"
            echo "comment<<EOF"
            jq -r '.comment' "$result_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post docs drift comment
        id: post-comment
        if: steps.drift-check.outputs.comment_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT: ${{ steps.drift-check.outputs.comment }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none --body "$COMMENT"

      - name: Gate on drift verdict
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.drift-check.outcome }}
          COMMENT_OUTCOME: ${{ steps.post-comment.outcome }}
          COMMENT_NEEDED: ${{ steps.drift-check.outputs.comment_needed }}
          HAS_DRIFT: ${{ steps.drift-check.outputs.has_drift }}
          SUMMARY: ${{ steps.drift-check.outputs.summary }}
        run: |
          if [ "$CHECK_OUTCOME" != "success" ]; then
            echo "::error::Deterministic docs drift checker did not complete (outcome: $CHECK_OUTCOME)."
            exit 1
          fi
          if [ "$COMMENT_NEEDED" = "true" ] && [ "$COMMENT_OUTCOME" != "success" ]; then
            echo "::error::Docs drift comment could not be posted (outcome: $COMMENT_OUTCOME)."
            exit 1
          fi
          if [ "$HAS_DRIFT" = "true" ]; then
            echo "::error::$SUMMARY See the app-docs-drift-check comment on this PR."
            exit 1
          fi
          echo "$SUMMARY"
