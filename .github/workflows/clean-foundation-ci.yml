name: Clean foundation CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  startup-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 packages/twenty-docker/twenty/test_entrypoint.py
      - run: sh -n packages/twenty-docker/twenty/entrypoint.sh
  custody-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: scripts/provenance/verify-source.sh
      - run: npx nx build twenty-shared
      - run: npx nx build twenty-server
      - name: Verify database initialization guards
        working-directory: packages/twenty-server
        run: yarn jest --config jest.config.mjs --runInBand --runTestsByPath src/database/scripts/__tests__/check-db-initialization.spec.ts src/database/scripts/__tests__/setup-db-utils.spec.ts
      - run: npx nx build twenty-front
      - run: npx nx build twenty-sdk
      - run: docker compose --env-file deploy/twenty-next/env/validation.env.example -f deploy/twenty-next/compose.yaml config --quiet
