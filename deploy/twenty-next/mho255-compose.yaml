# Disposable acceptance only. Always invoke through mho255-acceptance.sh.
x-environment: &environment
  PG_DATABASE_URL: postgres://twenty:synthetic-only@db:5432/twenty
  REDIS_URL: redis://redis:6379
  SERVER_URL: http://server:3000
  PRODUCT_BRAND_PRESET: mhoo
  PRODUCT_BRAND_DEPLOYMENT_ORIGIN: http://server:3000
  ENCRYPTION_KEY: ${MHO255_ENCRYPTION_KEY:?generated by harness}
  APP_SECRET: ${MHO255_APP_SECRET:?generated by harness}
  STORAGE_TYPE: local
  EMAIL_DRIVER: LOGGER
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: twenty
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U twenty -d twenty']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  server:
    image: ${MHO255_IMAGE:?immutable digest required}
    environment: *environment
    volumes: [files:/app/packages/twenty-server/.local-storage]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --max-time 5 http://localhost:3000/healthz']
      interval: 5s
      timeout: 6s
      retries: 120
  worker:
    image: ${MHO255_IMAGE:?immutable digest required}
    command: [yarn, 'worker:prod']
    environment:
      <<: *environment
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes: [files:/app/packages/twenty-server/.local-storage]
    networks: [private]
    healthcheck:
      disable: true
networks:
  private:
    internal: true
volumes:
  db-data: {}
  files: {}
