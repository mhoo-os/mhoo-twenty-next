name: mhoo_twenty_next

x-twenty-environment: &twenty-environment
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME:-twenty}
  REDIS_URL: redis://redis:6379
  SERVER_URL: ${SERVER_URL:?set a non-production SERVER_URL}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set a new ENCRYPTION_KEY}
  STORAGE_TYPE: local
  EMAIL_DRIVER: smtp
  EMAIL_SMTP_HOST: mailpit
  EMAIL_SMTP_PORT: 1025
  EMAIL_SMTP_NO_TLS: "true"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER:-twenty}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE_NAME:-twenty}
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_DATABASE_USER} -d $${PG_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.20.3
    ports: ["127.0.0.1:${MAILPIT_PORT:-8026}:8025"]
    networks: [private]
  server:
    image: ${TWENTY_IMAGE:?set immutable TWENTY_IMAGE digest}
    environment: *twenty-environment
    ports: ["127.0.0.1:${TWENTY_NEXT_PORT:-3101}:3000"]
    volumes: [server-files:/app/packages/twenty-server/.local-storage]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    image: ${TWENTY_IMAGE:?set immutable TWENTY_IMAGE digest}
    command: [yarn, worker:prod]
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes: [server-files:/app/packages/twenty-server/.local-storage]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      server: {condition: service_healthy}
    networks: [private]

networks:
  private: {}
volumes:
  db-data: {name: mhoo_twenty_next_db_20260901}
  redis-data: {name: mhoo_twenty_next_redis_20260901}
  server-files: {name: mhoo_twenty_next_files_20260901}
