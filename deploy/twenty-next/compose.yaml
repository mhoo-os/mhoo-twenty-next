name: mhoo_twenty_next

x-twenty-environment: &twenty-environment
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME:-twenty}
  REDIS_URL: redis://redis:6379
  SERVER_URL: ${SERVER_URL:?set a non-production SERVER_URL}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set a new ENCRYPTION_KEY}
  NODE_ENV: production
  AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
  AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
  AUTH_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED:-false}
  IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS:-true}
  IS_EMAIL_VERIFICATION_REQUIRED: ${IS_EMAIL_VERIFICATION_REQUIRED:-true}
  SIGN_IN_PREFILLED: ${SIGN_IN_PREFILLED:-false}
  IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-false}
  LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-DISABLED}
  CODE_INTERPRETER_TYPE: ${CODE_INTERPRETER_TYPE:-DISABLED}
  EXCEPTION_HANDLER_DRIVER: ${EXCEPTION_HANDLER_DRIVER:-CONSOLE}
  LOGGER_DRIVER: ${LOGGER_DRIVER:-CONSOLE}
  APPLICATION_LOG_DRIVER: ${APPLICATION_LOG_DRIVER:-CONSOLE}
  LOG_LEVELS: ${LOG_LEVELS:-log,error,warn,performance}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/packages/twenty-server/.local-storage}
  EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@validation.invalid}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Mhoo Validation}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
  EMAIL_SMTP_NO_TLS: ${EMAIL_SMTP_NO_TLS:-true}

services:
  db:
    image: ${POSTGRES_IMAGE:?set digest-pinned POSTGRES_IMAGE}
    init: true
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER:-twenty}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE_NAME:-twenty}
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:?set digest-pinned REDIS_IMAGE}
    init: true
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: ${MAILPIT_IMAGE:?set digest-pinned MAILPIT_IMAGE}
    init: true
    ports: ["127.0.0.1:${MAILPIT_PORT:-8026}:8025"]
    networks: [private]
  server:
    image: ${TWENTY_IMAGE:?set immutable TWENTY_IMAGE digest}
    init: true
    environment: *twenty-environment
    ports: ["127.0.0.1:${TWENTY_NEXT_PORT:-3101}:3000"]
    volumes: [server-files:/app/packages/twenty-server/.local-storage]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    image: ${TWENTY_IMAGE:?set immutable TWENTY_IMAGE digest}
    init: true
    command: [yarn, worker:prod]
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes: [server-files:/app/packages/twenty-server/.local-storage]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      server: {condition: service_healthy}
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "for proc in /proc/[0-9]*/cmdline; do tr '\\000' ' ' < \"$${proc}\" | grep -Eq '[w]orker:prod|[q]ueue-worker' && exit 0; done; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  private: {}
volumes:
  db-data: {name: "mhoo_twenty_next_db_${MHO183_VOLUME_SUFFIX:-validation}"}
  redis-data: {name: "mhoo_twenty_next_redis_${MHO183_VOLUME_SUFFIX:-validation}"}
  server-files: {name: "mhoo_twenty_next_files_${MHO183_VOLUME_SUFFIX:-validation}"}
